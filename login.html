<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        لاگ اِن - مدرسہ شہناز اختر للبنات
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="login-container">

        <div
            class="login-logo"
            aria-hidden="true"
        >
            🔐
        </div>


        <h1>
            لاگ اِن
        </h1>


        <div class="madrassa-name">
            مدرسہ شہناز اختر للبنات
        </div>


        <p class="address">
            گاؤں غرشٹو، ضلع بونیر
        </p>


        <!-- =========================
             SELECTED ACCOUNT TYPE
        ========================== -->

        <div
            id="selectedRoleBox"
            class="selected-role-box"
        >

            <span>
                اکاؤنٹ:
            </span>

            <strong id="selectedRoleText">
                منتخب نہیں
            </strong>

        </div>


        <!-- =========================
             LOGIN FORM
        ========================== -->

        <form
            id="loginForm"
            autocomplete="on"
        >


            <input
                type="hidden"
                id="loginRole"
                name="loginRole"
            >


            <label for="username">
                صارف نام
            </label>


            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                placeholder="صارف نام درج کریں"
                required
            >


            <label for="password">
                پاس ورڈ
            </label>


            <div class="password-box">


                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="پاس ورڈ درج کریں"
                    required
                >


                <button
                    type="button"
                    id="togglePassword"
                    class="eye-button"
                    aria-label="پاس ورڈ دکھائیں"
                >
                    👁️
                </button>


            </div>


            <div class="remember-row">


                <input
                    type="checkbox"
                    id="rememberMe"
                    name="rememberMe"
                >


                <label for="rememberMe">
                    مجھے یاد رکھیں
                </label>


            </div>


            <!-- =========================
                 LOGIN MESSAGE
            ========================== -->

            <div
                id="loginMessage"
                class="message"
                aria-live="polite"
            ></div>


            <!-- =========================
                 LOGIN BUTTON
            ========================== -->

            <button
                type="submit"
                id="loginButton"
            >
                🔐 لاگ اِن
            </button>


            <button
                type="button"
                id="backButton"
                class="back-button"
            >
                ↩️ واپس جائیں
            </button>


        </form>


        <!-- =========================
             ACCOUNT SECURITY
        ========================== -->

        <div class="login-security-note">

            🔒 صرف منظور شدہ اور فعال اکاؤنٹ
            لاگ اِن کر سکتا ہے۔

        </div>


        <div
            id="pendingAccountMessage"
            class="approval-notice hidden"
        >

            ⏳ آپ کی درخواست ابھی ایڈمن کی منظوری کے انتظار میں ہے۔

        </div>


        <div
            id="rejectedAccountMessage"
            class="rejected-notice hidden"
        >

            ❌ آپ کی درخواست منظور نہیں ہوئی۔
            مزید معلومات کے لیے مدرسہ انتظامیہ سے رابطہ کریں۔

        </div>


    </main>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =========================
         MAIN SCRIPT
    ========================== -->

    <script src="script.js?v=20"></script>


</body>

</html>
