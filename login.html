<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>لاگ اِن - مدرسہ شہناز اختر للبنات</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-logo">
            🔐
        </div>

        <h1>
            لاگ اِن
        </h1>

        <div class="madrassa-name">
            مدرسہ شہناز اختر للبنات
        </div>

        <p class="address">
            گاؤں غرشٹو، ضلع بونیر
        </p>


        <form id="loginForm">

            <label for="username">
                صارف نام
            </label>

            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                placeholder="صارف نام درج کریں"
                required
            >


            <label for="password">
                پاس ورڈ
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="پاس ورڈ درج کریں"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="eye-button"
                    aria-label="پاس ورڈ دکھائیں"
                >
                    👁️
                </button>

            </div>


            <div class="remember-row">

                <input
                    type="checkbox"
                    id="rememberMe"
                    name="rememberMe"
                >

                <label for="rememberMe">
                    مجھے یاد رکھیں
                </label>

            </div>


            <button
                type="submit"
                id="loginButton"
            >
                🔐 لاگ اِن
            </button>

            <button
                type="button"
                id="backButton"
                class="back-button"
            >
                ↩️ واپس جائیں
            </button>


            <div
                id="loginMessage"
                class="message"
            ></div>

        </form>

    </div>


    <!-- Supabase MUST load before script.js -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- script.js loaded ONLY ONCE -->

    <script src="script.js"></script>

</body>

</html>
