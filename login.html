        body.login-page-v2 {

            background:

                    180deg,
                    #f4f8f6 0%,

                );

            color: #17251f;

            overflow-x: hidden;
        }

           URDU / ARABIC / PASHTO
        ================================================== */

        }

           ENGLISH

           PAGE WRAPPER

            height: 48px;

            padding: 0;

            margin: 0;

                #cfdcd5;

            border-radius: 14px;

            background: #ffffff;

            color: #0d5b3b;

            font-size: 21px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            box-shadow:

                    63,
                    45,
                    0.07

        }


        .login-language-wrap {

            max-width: 52%;
        }


        .login-language-select {

           LOGIN CARD
        ================================================== */

                    72,
                    53,
                    0.10
                );
        }


        /* =================================================
           BRAND
        ================================================== */

        .login-brand {

            margin-bottom: 24px;
        }


        .login-lock {

            width: 58px;

            height: 58px;

            margin:
                0 auto

            border-radius: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #eaf5ef;

            color: #0d5b3b;

            font-size: 26px;
        }

            margin:

                8px;

            color: #0c5538;

                    42px

            font-weight: 700;

            line-height: 1.5;
        }


        .login-madrassa-name {

            margin: 0;

            color: #1d2d26;

            font-weight: 700;

            line-height: 1.9;

                0
                0;

            color: #738179;

            font-size: 13px;

            line-height: 1.9;
        }

            width: fit-content;

            max-width: 100%;

            margin:

                0;

            padding:
                8px
                16px;

            border-radius: 999px;

            background: #f4eee0;

            color: #80611f;

            font-weight: 700;

            font-size: 14px;

            line-height: 1.7;
        }

           FORM
        ================================================== */

            width: 100%;

            margin-top: 24px;
        }

            width: 100%;

            margin-bottom: 18px;
        }


        .login-label {

            display: block;

            width: 100%;

            margin-bottom: 8px;

            color: #24362e;

            font-size: 16px;

            font-weight: 700;

            line-height: 1.8;
        }

            width: 100%;

            height: 58px;

            border:

                #d4dfd9;

            border-radius: 16px;

            background: #fbfdfc;

            padding:

                16px;

            color: #18261f;

            font: inherit;

            font-size: 16px;

            outline: none;

            transition:
                border-color
                .2s ease,
                box-shadow
                .2s ease,
                background

        }


        .login-input:focus {

            border-color: #0d6643;

            background: #ffffff;

            box-shadow:

                rgba(
                    13,
                    102,
                    67,
                    0.10

        }

           PASSWORD
        ================================================== */

            position: relative;

            width: 100%;
        }


        .login-password-wrap

            padding-inline-end: 70px;
        }


        .login-eye {

            position: absolute;

            top: 50%;

            inset-inline-end: 7px;

            transform:

            width: 48px;

            height: 42px;

            min-width: 48px;

            min-height: 42px;

            margin: 0;

            padding: 0;

            border: 0;

            border-radius: 12px;

            background: #edf5f1;

            color: #0c5c3d;

            font-size: 19px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;
        }

           REMEMBER ME
        ================================================== */

            margin:

            color: #55665d;

            font-size: 14px;

            line-height: 1.7;

            height: 20px;

            font-weight: 700;

            line-height: 1.8;

            background: #fff0f1;

            border-inline-start:

            color: #24516a;

            background: #edf7fc;

            border:
                1px solid
                #bfdae8;

            border-inline-start:

<div class="login-page-wrapper">


    <main class="login-shell">


        <!-- =================================================
             TOP BAR
        ================================================== -->

                    </option>

                    <option value="ps">

                    </option>

                </select>

            </div>


        </div>



        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <section class="login-card-v2">


            <header class="login-brand">


                <div class="login-lock">
                    🔐
                </div>


                <h1
                    class="login-title"
                    data-login-i18n="loginTitle"
                >
                    لاگ اِن
                </h1>


                <p
                    class="login-madrassa-name"
                    data-login-i18n="madrassaName"
                >
                    مدرسہ شہناز اختر للبنات
                </p>


                <p
                    class="login-address"
                    data-login-i18n="address"
                >
                    گاؤں ہل غورغشتوں، ضلع بونیر
                </p>


                <div class="login-role-badge">

                    <span
                        data-login-i18n="account"
                    >
                        اکاؤنٹ
                    </span>

                    <span>
                        :
                    </span>

                    <span id="selectedRoleText">
                        —
                    </span>

                </div>


            </header>



            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="loginForm"
                class="login-form-v2"
                autocomplete="on"
            >


                <input
                    type="hidden"
                    id="loginRole"
                >



                <!-- USERNAME -->

                <div class="login-field">

                    <label
                        for="username"
                        class="login-label"
                        data-login-i18n="username"
                    >
                        صارف نام
                    </label>


                    <input
                        type="text"
                        id="username"
                        class="login-input"
                        autocomplete="username"
                        required
                        data-login-placeholder="usernamePlaceholder"
                        placeholder="صارف نام درج کریں"
                    >

                </div>



                <!-- PASSWORD -->

                <div class="login-field">

                    <label
                        for="password"
                        class="login-label"
                        data-login-i18n="password"
                    >
                        پاس ورڈ
                    </label>


                    <div class="login-password-wrap">

                        <input
                            type="password"
                            id="password"
                            class="login-input"
                            autocomplete="current-password"
                            required
                            data-login-placeholder="passwordPlaceholder"
                            placeholder="پاس ورڈ درج کریں"
                        >


                        <button
                            type="button"
                            id="togglePassword"
                            class="login-eye"
                            aria-label="Show password"
                        >
                            👁️
                        </button>

                    </div>

                </div>



                <!-- REMEMBER ME -->

                <label class="login-remember">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    <span
                        data-login-i18n="remember"
                    >
                        مجھے یاد رکھیں
                    </span>

                </label>



                <!-- =================================================
                     ONLY DYNAMIC LOGIN MESSAGE
                     No Pending / Rejected permanent text
                ================================================== -->

                <div
                    id="loginMessage"
                    role="alert"
                    aria-live="polite"
                ></div>



                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-primary"
                    data-login-i18n="loginButton"
                >
                    لاگ اِن
                </button>



                <!-- BACK -->

                <button
                    type="button"
                    id="backButtonBottom"
                    class="login-secondary"
                    data-login-i18n="back"
                >
                    واپس جائیں
                </button>


            </form>



            <!-- SECURITY NOTE -->

            <p
                class="login-security-note"
                data-login-i18n="securityNote"
            >
                صرف منظور شدہ اور فعال اکاؤنٹ لاگ اِن کر سکتا ہے۔
            </p>


        </section>


    </main>


</div>

    /* =================================================
       LANGUAGE STORAGE

       Login page first reads the language already
       selected on the Main / Introduction page.

       Default only when nothing was ever selected = Urdu
    ================================================== */

    function getSavedLanguage() {

        const possibleKeys = [

            "madrassaLanguage",

            "selectedLanguage",

            "siteLanguage",

            "language",

            "currentLanguage",

            "preferredLanguage"
        ];


        for (
            const key of possibleKeys
        ) {

            const value =
                localStorage.getItem(
                    key
                );


            if (
                value &&
                translations[value]
            ) {

                return value;
            }
        }


        return "ur";
    }



    function saveLanguage(
        language
    ) {

        if (
            !translations[
                language
            ]
        ) {

            language =
                "ur";
        }


        /*
           Save into all supported keys so
           Main Page and Login Page remain synced.
        */

        localStorage.setItem(
            "madrassaLanguage",
            language
        );


        localStorage.setItem(
            "selectedLanguage",
            language
        );


        localStorage.setItem(
            "siteLanguage",
            language
        );


        localStorage.setItem(
            "language",
            language
        );


        localStorage.setItem(
            "currentLanguage",
            language
        );


        localStorage.setItem(
            "preferredLanguage",
            language
        );
    }



    /* =================================================
       CURRENT LOGIN ROLE
    ================================================== */

    function currentRole() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const role =
            String(
                params.get(
                    "role"
                ) ||
                "admin"
            )
                .toLowerCase();


        if (
            [
                "admin",
                "teacher",
                "student"
            ]
                .includes(role)
        ) {

            return role;
        }


        return "admin";
    }



    /* =================================================
       APPLY LANGUAGE
    ================================================== */

    function applyLanguage(
        language
    ) {

        if (
            !translations[
                language
            ]
        ) {

            language =
                "ur";
        }


        const text =
            translations[
                language
            ];


        /* =============================================
           DIRECTION
        ============================================== */

        const rtlLanguages = [

            "ur",

            "ar",

            "ps"
        ];


        const isRTL =
            rtlLanguages.includes(
                language
            );


        const direction =
            isRTL
                ? "rtl"
                : "ltr";


        document.documentElement.lang =
            language;


        document.documentElement.dir =
            direction;


        document.body.dir =
            direction;


        document.body.setAttribute(
            "dir",
            direction
        );



        /* =============================================
           TEXT
        ============================================== */

        document
            .querySelectorAll(
                "[data-login-i18n]"
            )
            .forEach(
                element => {

                    const key =
                        element.dataset
                            .loginI18n;


                    if (
                        text[key] !==
                        undefined
                    ) {

                        element.textContent =
                            text[key];
                    }
                }
            );



        /* =============================================
           PLACEHOLDERS
        ============================================== */

        document
            .querySelectorAll(
                "[data-login-placeholder]"
            )
            .forEach(
                element => {

                    const key =
                        element.dataset
                            .loginPlaceholder;


                    if (
                        text[key] !==
                        undefined
                    ) {

                        element.placeholder =
                            text[key];
                    }
                }
            );



        /* =============================================
           ROLE
        ============================================== */

        const roleText =
            document.getElementById(
                "selectedRoleText"
            );


        if (roleText) {

            roleText.textContent =
                text.roles[
                    currentRole()
                ] ||
                text.roles.admin;
        }



        /* =============================================
           LANGUAGE SELECT
        ============================================== */

        const selector =
            document.getElementById(
                "loginLanguage"
            );


        if (selector) {

            selector.value =
                language;
        }



        /* =============================================
           INPUT DIRECTION
        ============================================== */

        const username =
            document.getElementById(
                "username"
            );


        const password =
            document.getElementById(
                "password"
            );


        if (username) {

            username.dir =
                direction;
        }


        if (password) {

            password.dir =
                direction;
        }



        /* =============================================
           TITLE
        ============================================== */

        document.title =
            text.loginTitle +
            " | " +
            text.madrassaName;



        window.LOGIN_LANGUAGE =
            language;


        window.LOGIN_TRANSLATIONS =
            translations;
    }



    /* =================================================
       TRANSLATE DYNAMIC SCRIPT.JS LOGIN MESSAGES
    ================================================== */

    function translateLoginMessage() {

        const box =
            document.getElementById(
                "loginMessage"
            );


        if (!box) {
            return;
        }


        const language =
            window.LOGIN_LANGUAGE ||
            getSavedLanguage();


        const text =
            translations[
                language
            ] ||
            translations.ur;


        const current =
            String(
                box.textContent ||
                ""
            )
                .trim();


        if (!current) {
            return;
        }


        const loadingMessages = [

            "لاگ اِن کیا جا رہا ہے...",

            "Logging in..."
        ];


        const emptyMessages = [

            "صارف نام اور پاس ورڈ درج کریں۔"
        ];


        const invalidMessages = [

            "صارف نام، پاس ورڈ یا اکاؤنٹ کی حالت درست نہیں ہے۔",

            "صارف نام، پاس ورڈ یا اکاؤنٹ کی حالت درست نہیں ہے۔",

            "لاگ اِن نہیں ہو سکا۔"
        ];


        let translated =
            current;


        if (
            loadingMessages.includes(
                current
            )
        ) {

            translated =
                text.loggingIn;


        } else if (
            emptyMessages.includes(
                current
            )
        ) {

            translated =
                text.emptyCredentials;


        } else if (
            invalidMessages.includes(
                current
            )
        ) {

            translated =
                text.invalidLogin;
        }


        if (
            translated !==
            current
        ) {

            box.textContent =
                translated;
        }


        /*
           Ensure important messages remain highlighted
        */

        if (
            translated ===
            text.invalidLogin ||
            translated ===
            text.emptyCredentials
        ) {

            box.classList.remove(
                "info",
                "success"
            );


            box.classList.add(
                "error"
            );


        } else if (
            translated ===
            text.loggingIn
        ) {

            box.classList.remove(
                "error",
                "success"
            );


            box.classList.add(
                "info"
            );
        }

    }



    /* =================================================
       START PAGE
    ================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            /*
               IMPORTANT:
               Main Page selected language is used here.
               If no selection exists, Urdu is default.
            */

            const language =
                getSavedLanguage();


            applyLanguage(
                language
            );



            /* ==========================================
               LANGUAGE CHANGE
            ========================================== */

            const selector =
                document.getElementById(
                    "loginLanguage"
                );


            if (selector) {

                selector.addEventListener(
                    "change",
                    function () {

                        const newLanguage =
                            selector.value;


                        saveLanguage(
                            newLanguage
                        );


                        applyLanguage(
                            newLanguage
                        );


                        translateLoginMessage();
                    }
                );
            }



            /* ==========================================
               BOTTOM BACK BUTTON
            ========================================== */

            const bottomBack =
                document.getElementById(
                    "backButtonBottom"
                );


            if (bottomBack) {

                bottomBack.addEventListener(
                    "click",
                    function () {

                        window.location.href =
                            "index.html";
                    }
                );
            }



            /* ==========================================
               WATCH LOGIN MESSAGE FROM script.js
            ========================================== */

            const loginMessage =
                document.getElementById(
                    "loginMessage"
                );


            if (loginMessage) {

                const observer =
                    new MutationObserver(
                        function () {

                            translateLoginMessage();
                        }
                    );


                observer.observe(
                    loginMessage,
                    {
                        childList:
                            true,

                        characterData:
                            true,

                        subtree:
                            true,

                        attributes:
                            true,

                        attributeFilter:
                            [
                                "class"
                            ]
                    }
                );
            }

        }
    );

})();

</script>
