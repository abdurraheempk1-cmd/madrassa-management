                </div>



                <!-- PASSWORD -->

                        for="password"

                    </label>


                    <div class="login-password-wrap">

                <!-- LOGIN -->

    /* =================================================
       READ MAIN PAGE LANGUAGE
    ================================================== */

    function getSavedLanguage() {

        const exactKeys = [

            "madrassaLanguage",

            "selectedLanguage",

            "siteLanguage",

            "language",

            "currentLanguage",

            "preferredLanguage",

            "appLanguage",

            "madrassa_language",

            "lang"
        ];


        for (
            const key of exactKeys
        ) {

            const value =
                localStorage.getItem(
                    key
                );


            if (
                value &&
                translations[
                    value
                ]
            ) {

                return value;
            }
        }


        /*
           Extra fallback:
           find the Main Page language even if
           it uses another language-related key.
        */

        for (
            let i = 0;
            i < localStorage.length;
            i++
        ) {

            const key =
                localStorage.key(i);


            if (
                !key ||
                !/lang|language/i.test(
                    key
                )
            ) {

                continue;
            }


            const value =
                localStorage.getItem(
                    key
                );


            if (
                value &&
                translations[
                    value
                ]
            ) {

                return value;
            }
        }


        /*
           First ever visit only
        */

        return "ur";
    }



    /* =================================================
       SAVE LANGUAGE
    ================================================== */

    function saveLanguage(
        language
    ) {

        if (
            !translations[
                language
            ]
        ) {

            language =
                "ur";
        }


        [
            "madrassaLanguage",
            "selectedLanguage",
            "siteLanguage",
            "language"
        ]
            .forEach(
                key => {

                    localStorage.setItem(
                        key,
                        language
                    );
                }
            );
    }



    /* =================================================
       ROLE
    ================================================== */

    function getRole() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const role =
            String(
                params.get(
                    "role"
                ) ||
                "admin"
            )
                .trim()
                .toLowerCase();


        if (
            [
                "admin",
                "teacher",
                "student"
            ]
                .includes(role)
        ) {

            return role;
        }


        return "admin";
    }



    /* =================================================
       APPLY LANGUAGE
    ================================================== */

    function applyLanguage(
        language
    ) {

        if (
            !translations[
                language
            ]
        ) {

            language =
                "ur";
        }


        const dictionary =
            translations[
                language
            ];


        const isRTL =
            [
                "ur",
                "ar",
                "ps"
            ]
                .includes(
                    language
                );


        const direction =
            isRTL
                ? "rtl"
                : "ltr";


        /* =============================================
           PAGE DIRECTION
        ============================================== */

        document.documentElement.lang =
            language;


        document.documentElement.dir =
            direction;


        document.body.dir =
            direction;


        document.body.setAttribute(
            "dir",
            direction
        );



        /* =============================================
           STATIC TEXT
        ============================================== */

        document
            .querySelectorAll(
                "[data-login-i18n]"
            )
            .forEach(
                element => {

                    const key =
                        element.dataset
                            .loginI18n;


                    if (
                        dictionary[key] !==
                        undefined
                    ) {

                        element.textContent =
                            dictionary[key];
                    }
                }
            );



        /* =============================================
           PLACEHOLDERS
        ============================================== */

        document
            .querySelectorAll(
                "[data-login-placeholder]"
            )
            .forEach(
                element => {

                    const key =
                        element.dataset
                            .loginPlaceholder;


                    if (
                        dictionary[key] !==
                        undefined
                    ) {

                        element.placeholder =
                            dictionary[key];
                    }
                }
            );



        /* =============================================
           ROLE
        ============================================== */

        const roleText =
            document.getElementById(
                "selectedRoleText"
            );


        if (roleText) {

            roleText.textContent =
                dictionary.roles[
                    getRole()
                ];
        }



        /* =============================================
           SELECT
        ============================================== */

        const selector =
            document.getElementById(
                "loginLanguage"
            );


        if (selector) {

            selector.value =
                language;
        }



        /* =============================================
           INPUT DIRECTION
        ============================================== */

        const username =
            document.getElementById(
                "username"
            );


        const password =
            document.getElementById(
                "password"
            );


        if (username) {

            username.dir =
                direction;
        }


        if (password) {

            password.dir =
                direction;
        }



        /* =============================================
           PAGE TITLE
        ============================================== */

        document.title =
            dictionary.loginTitle +
            " | " +
            dictionary.madrassaName;



        window.LOGIN_LANGUAGE =
            language;


        window.LOGIN_TRANSLATIONS =
            translations;
    }



    /* =================================================
       TRANSLATE ONLY LOGIN MESSAGES
       WITHOUT OBSERVER
    ================================================== */

    function translateLoginMessage(
        originalText
    ) {

        const language =
            window.LOGIN_LANGUAGE ||
            getSavedLanguage();


        const dictionary =
            translations[
                language
            ] ||
            translations.ur;


        const value =
            String(
                originalText ||
                ""
            )
                .trim();


        if (
            value ===
            "صارف نام اور پاس ورڈ درج کریں۔"
        ) {

            return dictionary
                .emptyCredentials;
        }


        if (
            value ===
            "لاگ اِن کیا جا رہا ہے..."
        ) {

            return dictionary
                .loggingIn;
        }


        if (
            value ===
            "صارف نام، پاس ورڈ یا اکاؤنٹ کی حالت درست نہیں ہے۔"
        ) {

            return dictionary
                .invalidLogin;
        }


        return originalText;
    }



    /* =================================================
       CONNECT WITH EXISTING script.js
       WITHOUT CHANGING LOGIN LOGIC
    ================================================== */

    if (
        window.App &&
        typeof window.App.message ===
        "function"
    ) {

        const originalMessage =
            window.App.message;


        window.App.message =
            function (
                target,
                text,
                type
            ) {

                let output =
                    text;


                const node =
                    typeof target ===
                    "string"
                        ? document
                            .getElementById(
                                target
                            )
                        : target;


                if (
                    node &&
                    node.id ===
                    "loginMessage"
                ) {

                    output =
                        translateLoginMessage(
                            text
                        );
                }


                return originalMessage.call(
                    window.App,
                    target,
                    output,
                    type
                );
            };
    }



    /*
       script.js sets the role name itself.
       We keep its login logic exactly as it is,
       then simply re-apply the selected language.
    */

    if (
        window.App &&
        typeof window.App.initLogin ===
        "function"
    ) {

        const originalInitLogin =
            window.App.initLogin;


        window.App.initLogin =
            function () {

                const result =
                    originalInitLogin.apply(
                        window.App,
                        arguments
                    );


                applyLanguage(
                    getSavedLanguage()
                );


                return result;
            };
    }



    /* =================================================
       PAGE READY
    ================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const language =
                getSavedLanguage();


            applyLanguage(
                language
            );



            /* ==========================================
               LANGUAGE SELECT
            ========================================== */

            const selector =
                document.getElementById(
                    "loginLanguage"
                );


            if (selector) {

                selector.addEventListener(
                    "change",
                    function () {

                        const newLanguage =
                            selector.value;


                        saveLanguage(
                            newLanguage
                        );


                        applyLanguage(
                            newLanguage
                        );


                        /*
                           Clear an old message when
                           language is manually changed.
                        */

                        const message =
                            document.getElementById(
                                "loginMessage"
                            );


                        if (message) {

                            message.textContent =
                                "";

                            message.classList.remove(
                                "error",
                                "info",
                                "success"
                            );
                        }
                    }
                );
            }

        }
    );

})();

</script>
