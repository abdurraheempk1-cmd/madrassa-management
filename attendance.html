<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        حاضری - مدرسہ شہناز اختر للبنات
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <main class="attendance-page">


        <!-- =========================
             HEADER
        ========================== -->

        <div class="page-header">

            <button
                type="button"
                id="backToDashboard"
                class="back-button"
            >
                ↩️ ڈیش بورڈ
            </button>


            <div>

                <h1>
                    📅 حاضری
                </h1>

                <p class="address">
                    مدرسہ شہناز اختر للبنات
                </p>

            </div>

        </div>


        <!-- =========================
             ATTENDANCE SELECTION
        ========================== -->

        <div class="student-form-card">

            <h2>
                📝 حاضری درج کریں
            </h2>


            <div
                id="attendanceMessage"
                class="message"
                aria-live="polite"
            ></div>


            <div class="form-grid">


                <div class="form-group">

                    <label for="attendanceDate">
                        تاریخ
                    </label>

                    <input
                        type="date"
                        id="attendanceDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="attendanceClass">
                        کلاس
                    </label>

                    <select
                        id="attendanceClass"
                        required
                    >

                        <option value="">
                            کلاس منتخب کریں
                        </option>

                        <option value="ناظرہ">
                            ناظرہ
                        </option>

                        <option value="حفظ">
                            حفظ
                        </option>

                        <option value="ترجمہ">
                            ترجمہ
                        </option>

                        <option value="درس نظامی">
                            درس نظامی
                        </option>

                        <option value="دیگر">
                            دیگر
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="attendancePeriod">
                        پیریڈ / سبق
                    </label>

                    <select
                        id="attendancePeriod"
                        required
                    >

                        <option value="">
                            پیریڈ منتخب کریں
                        </option>

                        <option value="1">
                            پہلا پیریڈ
                        </option>

                        <option value="2">
                            دوسرا پیریڈ
                        </option>

                        <option value="3">
                            تیسرا پیریڈ
                        </option>

                        <option value="4">
                            چوتھا پیریڈ
                        </option>

                        <option value="5">
                            پانچواں پیریڈ
                        </option>

                        <option value="6">
                            چھٹا پیریڈ
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="attendanceTeacher">
                        استاد
                    </label>

                    <select
                        id="attendanceTeacher"
                        required
                    >

                        <option value="">
                            استاد منتخب کریں
                        </option>

                    </select>

                </div>


            </div>


            <button
                type="button"
                id="loadAttendanceStudents"
                class="primary-button"
            >
                👧 طالبات لوڈ کریں
            </button>

        </div>


        <!-- =========================
             STUDENTS ATTENDANCE
        ========================== -->

        <div
            id="attendanceStudentsSection"
            class="student-form-card hidden"
        >

            <h2>
                👧 طالبات کی حاضری
            </h2>


            <div class="attendance-quick-actions">

                <button
                    type="button"
                    id="markAllPresent"
                    class="save-button"
                >
                    ✅ سب حاضر
                </button>


                <button
                    type="button"
                    id="clearAttendance"
                    class="cancel-button"
                >
                    🔄 انتخاب ختم کریں
                </button>

            </div>


            <div id="attendanceStudentsList"></div>


            <button
                type="button"
                id="saveAttendanceButton"
                class="save-button"
            >
                💾 حاضری محفوظ کریں
            </button>

        </div>


        <!-- =========================
             TODAY SUMMARY
        ========================== -->

        <div class="student-form-card">

            <h2>
                📊 حاضری کا خلاصہ
            </h2>


            <div
                id="attendanceSummary"
                class="attendance-summary-line"
            >

                <span>
                    کل:
                    <strong id="attendanceTotalCount">
                        0
                    </strong>
                </span>

                <span>
                    حاضر:
                    <strong id="attendancePresentCount">
                        0
                    </strong>
                </span>

                <span>
                    غیر حاضر:
                    <strong id="attendanceAbsentCount">
                        0
                    </strong>
                </span>

                <span>
                    رخصت:
                    <strong id="attendanceLeaveCount">
                        0
                    </strong>
                </span>

            </div>

        </div>


        <!-- =========================
             ATTENDANCE RECORDS
        ========================== -->

        <div class="student-form-card">

            <h2>
                📚 محفوظ شدہ حاضری
            </h2>


            <button
                type="button"
                id="loadAttendanceRecords"
                class="primary-button"
            >
                🔄 ریکارڈ دیکھیں
            </button>


            <div
                id="attendanceRecordsMessage"
                class="message"
                aria-live="polite"
            ></div>


            <div id="attendanceRecordsList">

                <div class="empty-students">
                    حاضری کا ریکارڈ یہاں دکھایا جائے گا۔
                </div>

            </div>

        </div>


    </main>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =========================
         MAIN SCRIPT
    ========================== -->

    <script src="script.js?v=21"></script>


</body>

</html>
