<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مالی نظام</title><link rel="stylesheet" href="style.css?v=20260930-bulkselect1"></head><body class="portal-page"><header class="portal-top"><a href="admin.html">← ڈیش بورڈ</a><h1>مالی نظام</h1><button id="financePrintButton" type="button">پرنٹ</button></header><main class="portal-main"><section class="metric-grid"><article><span id="financeCurrentBalance">0 PKR</span><small>موجودہ بیلنس</small></article><article><span id="financeTotalReceived">0 PKR</span><small>کل وصولی</small></article><article><span id="financeTotalPaid">0 PKR</span><small>کل ادائیگی</small></article><article><span id="financeRestrictedBalance">0 PKR</span><small>مخصوص فنڈ</small></article><article><span id="financeDonationBalance">0 PKR</span><small>غیر مخصوص عطیہ</small></article><article><span id="financeGeneralBalance">0 PKR</span><small>عام فنڈ</small></article></section>
<section class="portal-panel"><h2>عطیہ وصول کریں</h2><form id="donationForm" class="portal-form"><input id="donationAmount" type="number" min="1" required placeholder="رقم"><input id="donationReceivedFrom" required placeholder="وصول کنندہ / عطیہ دہندہ"><select id="donationFundType"><option value="restricted">مخصوص</option><option value="unrestricted_donation">غیر مخصوص</option></select><input id="donationPurpose" value="فی سبیل اللہ" placeholder="مقصد"><input id="donationPaymentMethod" placeholder="طریقہ ادائیگی"><input id="donationReference" placeholder="حوالہ"><textarea id="donationNotes" placeholder="نوٹ"></textarea><button type="submit">عطیہ محفوظ کریں</button></form></section>
<section class="portal-panel"><h2>خرچ درج کریں</h2><form id="expenseForm" class="portal-form"><input id="expenseAmount" type="number" min="1" required placeholder="رقم"><input id="expensePaidTo" required placeholder="کس کو ادا کیا"><input id="expensePurpose" required placeholder="مقصد"><select id="expenseFundType"><option value="general">عام فنڈ</option><option value="restricted">مخصوص فنڈ</option><option value="unrestricted_donation">غیر مخصوص عطیہ</option></select><input id="expenseStudentId" type="number" placeholder="طالبہ ID (اختیاری)"><input id="expenseTeacherId" type="number" placeholder="استاد ID (اختیاری)"><input id="expensePaymentMethod" placeholder="طریقہ ادائیگی"><input id="expenseReference" placeholder="حوالہ"><textarea id="expenseNotes" placeholder="نوٹ"></textarea><button type="submit">خرچ محفوظ کریں</button></form></section>
<section class="portal-panel"><h2>لین دین کی تاریخ</h2><div class="table-wrap"><table><thead><tr><th>نمبر</th><th>قسم</th><th>فنڈ</th><th>رقم</th><th>مقصد</th><th>تاریخ</th></tr></thead><tbody id="financeHistoryBody"></tbody></table></div></section></main><script src="i18n.js?v=20260930-bulkselect1"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="script.js?v=20260930-bulkselect1"></script></body></html>
