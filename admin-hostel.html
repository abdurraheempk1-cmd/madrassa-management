<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مدرسہ میں رہائش</title>
  <link rel="stylesheet" href="style.css?v=20261004-hostel2">
  <style>
    .hostel-status{margin-top:10px;padding:10px 12px;border:1px solid #dbe6df;border-radius:12px;background:#f7faf8;line-height:1.8}
    .hostel-status.error{border-color:#efc7c7;background:#fff5f5;color:#8a1f1f}
    .hostel-status.success{border-color:#b9dfca;background:#f1fbf5;color:#17613d}
    .hostel-student-meta{margin-top:8px;color:#5d6d65;font-size:13px}
    .hostel-actions-disabled{opacity:.55;pointer-events:none}
    .hostel-history-empty{text-align:center;padding:18px;color:#78857f}
  </style>
</head>
<body class="portal-page">

<header class="portal-top">
  <a href="admin.html">← ڈیش بورڈ</a>
  <h1>مدرسہ میں رہائش — آمد و رفت</h1>
</header>

<main class="portal-main">

  <section class="portal-panel">
    <label>
      طالبہ
      <select id="hostelStudentId">
        <option value="">طالبات لوڈ ہو رہی ہیں...</option>
      </select>
    </label>
    <div id="hostelStudentMeta" class="hostel-student-meta"></div>
    <div id="hostelPageMessage" class="hostel-status">طالبہ منتخب کریں۔</div>
  </section>

  <section class="portal-panel">
    <h2>روانگی درج کریں</h2>
    <form id="hostelExitForm" class="portal-form hostel-actions-disabled">
      <select id="hostelMahramId">
        <option value="">پہلے طالبہ منتخب کریں</option>
      </select>
      <input id="hostelDestination" placeholder="منزل">
      <input id="hostelReason" placeholder="وجہ">
      <textarea id="hostelExitNotes" placeholder="نوٹ"></textarea>
      <button type="submit" id="hostelExitSubmit" disabled>روانگی محفوظ کریں</button>
    </form>
  </section>

  <section class="portal-panel">
    <h2>واپسی درج کریں</h2>
    <form id="hostelReturnForm" class="portal-form hostel-actions-disabled">
      <select id="hostelMovementId">
        <option value="">پہلے طالبہ منتخب کریں</option>
      </select>
      <input id="hostelReturnPersonName" placeholder="ساتھ لانے والے کا نام">
      <input id="hostelReturnRelation" placeholder="رشتہ">
      <input id="hostelReturnCNIC" placeholder="شناختی نمبر">
      <input id="hostelReturnPhone" placeholder="فون">
      <textarea id="hostelReturnNotes" placeholder="نوٹ"></textarea>
      <button type="submit" id="hostelReturnSubmit" disabled>واپسی محفوظ کریں</button>
    </form>
  </section>

  <section class="portal-panel">
    <h2>مکمل تاریخ</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>روانگی</th>
            <th>محرم</th>
            <th>منزل</th>
            <th>وجہ</th>
            <th>واپسی</th>
            <th>حالت</th>
          </tr>
        </thead>
        <tbody id="hostelHistoryBody">
          <tr><td colspan="6" class="hostel-history-empty">طالبہ منتخب کریں۔</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<script src="i18n.js?v=20261004-hostel2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js?v=20261004-hostel2"></script>
<script src="hostel-fix.js?v=20261004-hostel2"></script>
</body>
</html>
