<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        اساتذہ - مدرسہ شہناز اختر للبنات
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <main class="teacher-page">


        <!-- =========================
             HEADER
        ========================== -->

        <div class="teacher-header">

            <div class="teacher-header-buttons">

                <button
                    type="button"
                    id="backToDashboard"
                    class="back-button"
                >
                    ↩️ ڈیش بورڈ
                </button>

                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button"
                >
                    🚪 لاگ آؤٹ
                </button>

            </div>


            <div>

                <h1>
                    👩‍🏫 اساتذہ
                </h1>

                <p class="address">
                    مدرسہ شہناز اختر للبنات
                </p>

            </div>

        </div>


        <!-- =========================
             STATISTICS
        ========================== -->

        <div class="teacher-stats">


            <div class="teacher-stat-card">

                <div class="teacher-stat-icon">
                    👩‍🏫
                </div>

                <div class="teacher-stat-title">
                    کل اساتذہ
                </div>

                <div
                    id="teacherTotal"
                    class="teacher-stat-number"
                >
                    0
                </div>

            </div>


            <div class="teacher-stat-card">

                <div class="teacher-stat-icon">
                    ✅
                </div>

                <div class="teacher-stat-title">
                    فعال اساتذہ
                </div>

                <div
                    id="activeTeacherTotal"
                    class="teacher-stat-number"
                >
                    0
                </div>

            </div>


            <div class="teacher-stat-card">

                <div class="teacher-stat-icon">
                    ⏳
                </div>

                <div class="teacher-stat-title">
                    زیرِ منظوری درخواستیں
                </div>

                <div
                    id="pendingTeacherTotal"
                    class="teacher-stat-number"
                >
                    0
                </div>

            </div>

        </div>


        <!-- =========================
             ADMIN ACTION
        ========================== -->

        <div
            id="teacherAdminActions"
            class="teacher-section admin-only"
        >

            <button
                type="button"
                id="showTeacherForm"
                class="teacher-add-button"
            >
                ➕ نیا استاد شامل کریں
            </button>

        </div>


        <!-- =========================
             TEACHER FORM
        ========================== -->

        <div
            id="teacherFormContainer"
            class="teacher-section hidden admin-only"
        >

            <h2 id="teacherFormTitle">
                👩‍🏫 نئے استاد کی معلومات
            </h2>


            <div
                id="teacherFormMessage"
                class="message"
                aria-live="polite"
            ></div>


            <form id="teacherForm">


                <input
                    type="hidden"
                    id="editTeacherId"
                >


                <div class="teacher-form-grid">


                    <div class="teacher-field">

                        <label for="teacherCode">
                            استاد کا کوڈ
                        </label>

                        <input
                            type="text"
                            id="teacherCode"
                            placeholder="مثلاً T-001"
                            required
                        >

                    </div>


                    <div class="teacher-field">

                        <label for="teacherName">
                            استاد کا نام
                        </label>

                        <input
                            type="text"
                            id="teacherName"
                            placeholder="استاد کا نام"
                            required
                        >

                    </div>


                    <div class="teacher-field">

                        <label for="teacherFatherName">
                            والد کا نام
                        </label>

                        <input
                            type="text"
                            id="teacherFatherName"
                            placeholder="والد کا نام"
                            required
                        >

                    </div>


                    <div class="teacher-field">

                        <label for="teacherPhone">
                            موبائل نمبر
                        </label>

                        <input
                            type="tel"
                            id="teacherPhone"
                            inputmode="numeric"
                            maxlength="11"
                            placeholder="03XXXXXXXXX"
                            required
                        >

                    </div>


                    <div class="teacher-field">

                        <label for="teacherCNIC">
                            شناختی کارڈ نمبر
                        </label>

                        <input
                            type="text"
                            id="teacherCNIC"
                            inputmode="numeric"
                            maxlength="15"
                            placeholder="00000-0000000-0"
                            required
                        >

                    </div>


                    <div class="teacher-field">

                        <label for="teacherDateOfBirth">
                            تاریخ پیدائش
                        </label>

                        <input
                            type="date"
                            id="teacherDateOfBirth"
                        >

                    </div>


                    <div class="teacher-field">

                        <label for="teacherQualification">
                            تعلیمی قابلیت
                        </label>

                        <input
                            type="text"
                            id="teacherQualification"
                            placeholder="مثلاً عالمہ، ایم اے، بی اے"
                            required
                        >

                    </div>


                    <div class="teacher-field">

                        <label for="teacherJoiningDate">
                            تقرری کی تاریخ
                        </label>

                        <input
                            type="date"
                            id="teacherJoiningDate"
                            required
                        >

                    </div>


                    <div class="teacher-field">

                        <label for="teacherStatus">
                            استاد کی حیثیت
                        </label>

                        <select
                            id="teacherStatus"
                            required
                        >

                            <option value="active">
                                فعال
                            </option>

                            <option value="inactive">
                                غیر فعال
                            </option>

                        </select>

                    </div>


                    <div class="teacher-field full-width">

                        <label for="teacherAddress">
                            مکمل پتہ
                        </label>

                        <textarea
                            id="teacherAddress"
                            rows="3"
                            placeholder="استاد کا مکمل پتہ"
                            required
                        ></textarea>

                    </div>

                </div>


                <!-- =========================
                     BUTTONS
                ========================== -->

                <div class="teacher-form-buttons">

                    <button
                        type="submit"
                        id="saveTeacherButton"
                        class="save-button"
                    >
                        💾 محفوظ کریں
                    </button>

                    <button
                        type="button"
                        id="cancelTeacherButton"
                        class="cancel-button"
                    >
                        ❌ منسوخ کریں
                    </button>

                </div>

            </form>

        </div>


        <!-- =========================
             SEARCH
        ========================== -->

        <div class="teacher-section">

            <h2>
                🔍 استاد تلاش کریں
            </h2>

            <input
                type="search"
                id="teacherSearch"
                class="teacher-search-input"
                placeholder="نام، کوڈ، شناختی کارڈ یا موبائل نمبر سے تلاش کریں"
            >

        </div>


        <!-- =========================
             TEACHER LIST
        ========================== -->

        <div class="teacher-section">

            <div class="teacher-list-header">

                <h2>
                    👩‍🏫 اساتذہ کی فہرست
                </h2>

                <span
                    id="teacherListCount"
                    class="teacher-list-count"
                >
                    0
                </span>

            </div>


            <div
                id="teacherListMessage"
                class="message"
                aria-live="polite"
            ></div>


            <div
                id="teacherList"
                class="teacher-list"
            >

                <div class="teacher-empty">
                    اساتذہ کا ریکارڈ لوڈ ہو رہا ہے۔
                </div>

            </div>

        </div>


    </main>


    <!-- =========================
         TEACHER DETAILS
    ========================== -->

    <div
        id="teacherDetailsOverlay"
        class="teacher-details-overlay hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="teacherDetailsTitle"
    >

        <div
            id="teacherDetailsBox"
            class="teacher-details-box"
        >

            <div class="teacher-details-header">

                <h2 id="teacherDetailsTitle">
                    استاد کی تفصیلات
                </h2>

                <button
                    type="button"
                    id="closeTeacherDetails"
                    class="close-details-button"
                    aria-label="تفصیلات بند کریں"
                >
                    ✖
                </button>

            </div>


            <div id="teacherDetailsContent"></div>

        </div>

    </div>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =========================
         MAIN SCRIPT
    ========================== -->

    <script src="script.js?v=21"></script>


</body>

</html>
