<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>اساتذہ - مدرسہ شہناز اختر للبنات</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

    <style>

        /* =====================================================
           TEACHER PAGE DESIGN
        ===================================================== */

        .teacher-page {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .teacher-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .teacher-header h1 {
            margin: 0;
            font-size: 30px;
        }

        .teacher-header .address {
            margin: 5px 0 0;
        }

        .teacher-header-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .teacher-header button {
            width: auto;
            min-width: 130px;
        }

        .teacher-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .teacher-stat-card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .teacher-stat-icon {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .teacher-stat-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .teacher-stat-number {
            font-size: 30px;
            font-weight: 700;
        }

        .teacher-section {
            background: white;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .teacher-section h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 23px;
        }

        .teacher-add-button {
            width: 100%;
            font-size: 18px;
            padding: 14px;
        }

        .teacher-form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .teacher-field {
            display: flex;
            flex-direction: column;
        }

        .teacher-field.full-width {
            grid-column: 1 / -1;
        }

        .teacher-field label {
            font-weight: 600;
            margin-bottom: 7px;
        }

        .teacher-field input,
        .teacher-field textarea,
        .teacher-search-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
        }

        .teacher-field input:focus,
        .teacher-field textarea:focus,
        .teacher-search-input:focus {
            outline: none;
            border-color: #555;
        }

        .teacher-form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .teacher-form-buttons button {
            flex: 1;
        }

        .teacher-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .teacher-list-header h2 {
            margin: 0;
        }

        .teacher-list-count {
            min-width: 35px;
            padding: 5px 12px;
            border-radius: 20px;
            background: #eee;
            text-align: center;
            font-weight: 700;
        }

        .teacher-list {
            width: 100%;
        }

        .teacher-empty {
            text-align: center;
            padding: 30px 10px;
            font-size: 17px;
        }

        @media (max-width: 700px) {

            .teacher-page {
                padding: 10px;
            }

            .teacher-header {
                flex-direction: column;
                text-align: center;
            }

            .teacher-header-buttons {
                width: 100%;
                flex-direction: column;
            }

            .teacher-header button {
                width: 100%;
            }

            .teacher-stats {
                grid-template-columns: 1fr;
            }

            .teacher-form-grid {
                grid-template-columns: 1fr;
            }

            .teacher-field.full-width {
                grid-column: auto;
            }

            .teacher-form-buttons {
                flex-direction: column;
            }

            .teacher-header h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

<div class="teacher-page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="teacher-header">

        <div class="teacher-header-buttons">

            <button
                type="button"
                id="backToDashboard"
                class="back-button"
            >
                ↩️ ڈیش بورڈ
            </button>

            <button
                type="button"
                id="logoutButton"
                class="logout-button"
            >
                🚪 لاگ آؤٹ
            </button>

        </div>


        <div>

            <h1>
                👩‍🏫 اساتذہ
            </h1>

            <p class="address">
                مدرسہ شہناز اختر للبنات
            </p>

        </div>

    </div>


    <!-- =====================================================
         STATISTICS
    ====================================================== -->

    <div class="teacher-stats">


        <div class="teacher-stat-card">

            <div class="teacher-stat-icon">
                👩‍🏫
            </div>

            <div class="teacher-stat-title">
                کل اساتذہ
            </div>

            <div
                class="teacher-stat-number"
                id="teacherTotal"
            >
                0
            </div>

        </div>


        <div class="teacher-stat-card">

            <div class="teacher-stat-icon">
                ✅
            </div>

            <div class="teacher-stat-title">
                فعال اساتذہ
            </div>

            <div
                class="teacher-stat-number"
                id="activeTeacherTotal"
            >
                0
            </div>

        </div>


        <div class="teacher-stat-card">

            <div class="teacher-stat-icon">
                ⏳
            </div>

            <div class="teacher-stat-title">
                زیرِ منظوری
            </div>

            <div
                class="teacher-stat-number"
                id="pendingTeacherTotal"
            >
                0
            </div>

        </div>

    </div>


    <!-- =====================================================
         ADD TEACHER
    ====================================================== -->

    <div class="teacher-section">

        <button
            type="button"
            id="showTeacherForm"
            class="teacher-add-button"
        >
            ➕ نیا استاد شامل کریں
        </button>

    </div>


    <!-- =====================================================
         TEACHER FORM
    ====================================================== -->

    <div
        id="teacherFormContainer"
        class="teacher-section hidden"
    >

        <h2>
            👩‍🏫 نئے استاد کی معلومات
        </h2>


        <form id="teacherForm">


            <div class="teacher-form-grid">


                <div class="teacher-field">

                    <label for="teacherCode">
                        استاد کا کوڈ
                    </label>

                    <input
                        type="text"
                        id="teacherCode"
                        placeholder="مثلاً T-001"
                        required
                    >

                </div>


                <div class="teacher-field">

                    <label for="teacherName">
                        استاد کا نام
                    </label>

                    <input
                        type="text"
                        id="teacherName"
                        placeholder="استاد کا نام"
                        required
                    >

                </div>


                <div class="teacher-field">

                    <label for="teacherFatherName">
                        والد کا نام
                    </label>

                    <input
                        type="text"
                        id="teacherFatherName"
                        placeholder="والد کا نام"
                    >

                </div>


                <div class="teacher-field">

                    <label for="teacherPhone">
                        موبائل نمبر
                    </label>

                    <input
                        type="tel"
                        id="teacherPhone"
                        inputmode="numeric"
                        maxlength="11"
                        placeholder="03XXXXXXXXX"
                    >

                </div>


                <div class="teacher-field">

                    <label for="teacherCNIC">
                        شناختی کارڈ نمبر
                    </label>

                    <input
                        type="text"
                        id="teacherCNIC"
                        inputmode="numeric"
                        maxlength="13"
                        placeholder="13 ہندسوں کا شناختی کارڈ نمبر"
                    >

                </div>


                <div class="teacher-field">

                    <label for="teacherQualification">
                        تعلیمی قابلیت
                    </label>

                    <input
                        type="text"
                        id="teacherQualification"
                        placeholder="مثلاً عالمہ، MA، BA وغیرہ"
                    >

                </div>


                <div class="teacher-field">

                    <label for="teacherJoiningDate">
                        تقرری کی تاریخ
                    </label>

                    <input
                        type="date"
                        id="teacherJoiningDate"
                    >

                </div>


                <div class="teacher-field full-width">

                    <label for="teacherAddress">
                        مکمل پتہ
                    </label>

                    <textarea
                        id="teacherAddress"
                        rows="3"
                        placeholder="استاد کا مکمل پتہ"
                    ></textarea>

                </div>


            </div>


            <div class="teacher-form-buttons">

                <button
                    type="submit"
                    id="saveTeacherButton"
                >
                    💾 استاد محفوظ کریں
                </button>


                <button
                    type="button"
                    id="cancelTeacherButton"
                    class="back-button"
                >
                    ❌ منسوخ کریں
                </button>

            </div>


            <div
                id="teacherFormMessage"
                class="message"
            ></div>


        </form>

    </div>


    <!-- =====================================================
         SEARCH
    ====================================================== -->

    <div class="teacher-section">

        <h2>
            🔍 استاد تلاش کریں
        </h2>

        <input
            type="search"
            id="teacherSearch"
            class="teacher-search-input"
            placeholder="نام، کوڈ یا موبائل نمبر سے تلاش کریں..."
        >

    </div>


    <!-- =====================================================
         TEACHER LIST
    ====================================================== -->

    <div class="teacher-section">


        <div class="teacher-list-header">

            <h2>
                👩‍🏫 اساتذہ کی فہرست
            </h2>

            <span
                id="teacherListCount"
                class="teacher-list-count"
            >
                0
            </span>

        </div>


        <div
            id="teacherList"
            class="teacher-list"
        >

            <div class="teacher-empty">

                ابھی کوئی استاد موجود نہیں۔

            </div>

        </div>


    </div>


</div>


<!-- =====================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js?v=3"></script>


</body>

</html>
