<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ڈیش بورڈ - مدرسہ شہناز اختر للبنات</title>


    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap"
          rel="stylesheet">


    <!-- Main CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <div class="dashboard">


        <!-- =========================
             DASHBOARD HEADER
        ========================== -->

        <div class="dashboard-header">

            <div>

                <div class="small-title">
                    مدرسہ مینجمنٹ سسٹم
                </div>

                <h1>
                    ڈیش بورڈ
                </h1>

            </div>


            <div class="dashboard-logo">
                🕌
            </div>

        </div>



        <!-- =========================
             WELCOME
        ========================== -->

        <div class="welcome-card">

            <h2 id="welcomeMessage">
                خوش آمدید
            </h2>

            <p>
                مدرسہ شہناز اختر للبنات کے انتظامی نظام میں خوش آمدید۔
            </p>

        </div>



        <!-- =========================
             STATISTICS
        ========================== -->

        <div class="stats-grid">


            <!-- طالبات -->

            <div class="stat-card">

                <div class="stat-icon">
                    👧
                </div>

                <div>

                    <strong id="studentTotal">
                        0
                    </strong>

                    <span>
                        کل طالبات
                    </span>

                </div>

            </div>



            <!-- اساتذہ -->

            <div class="stat-card">

                <div class="stat-icon">
                    👩‍🏫
                </div>

                <div>

                    <strong>
                        0
                    </strong>

                    <span>
                        کل اساتذہ
                    </span>

                </div>

            </div>



            <!-- ہاسٹل -->

            <div class="stat-card">

                <div class="stat-icon">
                    🏠
                </div>

                <div>

                    <strong>
                        0
                    </strong>

                    <span>
                        ہاسٹل
                    </span>

                </div>

            </div>



            <!-- کلاسز -->

            <div class="stat-card">

                <div class="stat-icon">
                    📚
                </div>

                <div>

                    <strong>
                        0
                    </strong>

                    <span>
                        کلاسز
                    </span>

                </div>

            </div>


        </div>



        <!-- =========================
             MAIN MENU TITLE
        ========================== -->

        <h2 class="section-title">
            مین مینو
        </h2>



        <!-- =========================
             MAIN MENU
        ========================== -->

        <div class="menu-grid">


            <!-- =====================
                 STUDENTS
            ====================== -->

            <button
                type="button"
                class="menu-card"
                id="studentsMenu"
                data-page="students"
            >

                <span class="menu-icon">
                    👧
                </span>

                <span>
                    طالبات
                </span>

                <small>
                    طالبات کا ریکارڈ
                </small>

            </button>



            <!-- =====================
                 TEACHERS
            ====================== -->

            <button
                type="button"
                class="menu-card"
                id="teachersMenu"
            >

                <span class="menu-icon">
                    👩‍🏫
                </span>

                <span>
                    اساتذہ
                </span>

                <small>
                    اساتذہ کا ریکارڈ
                </small>

            </button>



            <!-- =====================
                 ATTENDANCE
            ====================== -->

            <button
                type="button"
                class="menu-card"
                id="attendanceMenu"
            >

                <span class="menu-icon">
                    📋
                </span>

                <span>
                    حاضری
                </span>

                <small>
                    روزانہ حاضری
                </small>

            </button>



            <!-- =====================
                 HOSTEL
            ====================== -->

            <button
                type="button"
                class="menu-card"
                id="hostelMenu"
            >

                <span class="menu-icon">
                    🏠
                </span>

                <span>
                    ہاسٹل
                </span>

                <small>
                    ہاسٹل کا ریکارڈ
                </small>

            </button>



            <!-- =====================
                 FEES
            ====================== -->

            <button
                type="button"
                class="menu-card"
                id="feesMenu"
            >

                <span class="menu-icon">
                    💰
                </span>

                <span>
                    فیس
                </span>

                <small>
                    فیس کا ریکارڈ
                </small>

            </button>



            <!-- =====================
                 REPORTS
            ====================== -->

            <button
                type="button"
                class="menu-card"
                id="reportsMenu"
            >

                <span class="menu-icon">
                    📊
                </span>

                <span>
                    رپورٹس
                </span>

                <small>
                    مختلف رپورٹس
                </small>

            </button>


        </div>



        <!-- =========================
             LOGOUT
        ========================== -->

        <button
            type="button"
            id="logoutButton"
            class="logout-button"
        >

            🚪 لاگ آؤٹ

        </button>


    </div>



    <!-- =========================
         SUPABASE
         MUST LOAD FIRST
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



    <!-- =========================
         MAIN JAVASCRIPT
         LOAD ONLY ONCE
    ========================== -->

    <script src="script.js"></script>


</body>

</html>
