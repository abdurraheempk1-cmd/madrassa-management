<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ڈیش بورڈ - مدرسہ شہناز اختر للبنات
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="dashboard">


        <!-- =========================
             HEADER
        ========================== -->

        <div class="dashboard-header">

            <div>

                <div class="small-title">
                    مدرسہ مینجمنٹ سسٹم
                </div>

                <h1>
                    مدرسہ شہناز اختر للبنات
                </h1>

                <p class="address">
                    گاؤں غرشٹو، ضلع بونیر
                </p>

            </div>


            <div
                class="dashboard-logo"
                aria-hidden="true"
            >
                🕌
            </div>

        </div>


        <!-- =========================
             WELCOME
        ========================== -->

        <div class="welcome-card">

            <h2 id="dashboardWelcome">
                خوش آمدید
            </h2>

            <p id="dashboardRoleText">
                مدرسہ مینجمنٹ سسٹم
            </p>

        </div>


        <!-- =========================
             STATISTICS
        ========================== -->

        <div class="stats-grid">


            <div class="stat-card">

                <div class="stat-icon">
                    👧
                </div>

                <div>

                    <strong id="studentTotal">
                        0
                    </strong>

                    <span>
                        کل طالبات
                    </span>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    👩‍🏫
                </div>

                <div>

                    <strong id="teacherTotal">
                        0
                    </strong>

                    <span>
                        کل اساتذہ
                    </span>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📝
                </div>

                <div>

                    <strong id="pendingApplicationTotal">
                        0
                    </strong>

                    <span>
                        زیرِ منظوری درخواستیں
                    </span>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📅
                </div>

                <div>

                    <strong id="todayAttendanceTotal">
                        0
                    </strong>

                    <span>
                        آج کی حاضری
                    </span>

                </div>

            </div>


        </div>


        <!-- =========================
             MENU
        ========================== -->

        <h2 class="section-title">
            انتظامی مینو
        </h2>


        <div class="menu-grid">


            <button
                type="button"
                id="studentsButton"
                class="menu-card"
            >

                <span class="menu-icon">
                    👧
                </span>

                <span>
                    طالبات
                </span>

                <small>
                    طالبات کا ریکارڈ
                </small>

            </button>


            <button
                type="button"
                id="teachersButton"
                class="menu-card"
            >

                <span class="menu-icon">
                    👩‍🏫
                </span>

                <span>
                    اساتذہ
                </span>

                <small>
                    اساتذہ کا ریکارڈ
                </small>

            </button>


            <button
                type="button"
                id="attendanceButton"
                class="menu-card"
            >

                <span class="menu-icon">
                    📅
                </span>

                <span>
                    حاضری
                </span>

                <small>
                    روزانہ حاضری
                </small>

            </button>


            <button
                type="button"
                id="approvalsButton"
                class="menu-card admin-only"
            >

                <span class="menu-icon">
                    ✅
                </span>

                <span>
                    درخواستیں
                </span>

                <small>
                    منظوری اور جانچ
                </small>

            </button>


            <button
                type="button"
                id="announcementsButton"
                class="menu-card"
            >

                <span class="menu-icon">
                    📢
                </span>

                <span>
                    اعلانات
                </span>

                <small>
                    ہوم ورک اور اعلانات
                </small>

            </button>


            <button
                type="button"
                id="reportsButton"
                class="menu-card admin-only"
            >

                <span class="menu-icon">
                    📊
                </span>

                <span>
                    رپورٹس
                </span>

                <small>
                    مدرسہ کی رپورٹس
                </small>

            </button>


        </div>


        <!-- =========================
             LOGOUT
        ========================== -->

        <button
            type="button"
            id="logoutButton"
            class="logout-button"
        >
            🚪 لاگ آؤٹ
        </button>


    </main>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =========================
         MAIN SCRIPT
    ========================== -->

    <script src="script.js?v=21"></script>

</body>

</html>
