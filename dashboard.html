<!DOCTYPE html><html lang="ur" dir="rtl"><head><meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ایڈمن ڈیش بورڈ</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head><body><main class="dashboard" id="dashboard">

    <header class="dashboard-header">

        <div>

            <p class="small-title">
                مدرسہ شہناز اختر للبنات
            </p>

            <h1 id="dashboardTitle">
                ڈیش بورڈ
            </h1>

        </div>

        <div class="dashboard-logo">
            📖
        </div>

    </header>

    <section class="welcome-card">

        <h2>
            السلام علیکم!
        </h2>

        <p>
            مدرسہ مینجمنٹ سسٹم میں خوش آمدید
        </p>

    </section>

    <section class="stats-grid">

        <div class="stat-card">

            <div class="stat-icon">
                👧
            </div>

            <div>
                <strong id="studentTotal">
                    0
                </strong>

                <span>
                    طالبات
                </span>
            </div>

        </div>

        <div class="stat-card">

            <div class="stat-icon">
                👩‍🏫
            </div>

            <div>
                <strong>
                    0
                </strong>

                <span>
                    استادہ
                </span>
            </div>

        </div>

        <div class="stat-card">

            <div class="stat-icon">
                🏫
            </div>

            <div>
                <strong>
                    0
                </strong>

                <span>
                    کلاسز
                </span>
            </div>

        </div>

        <div class="stat-card">

            <div class="stat-icon">
                💰
            </div>

            <div>
                <strong>
                    0
                </strong>

                <span>
                    فیس
                </span>
            </div>

        </div>

    </section>

    <section>

        <h2 class="section-title">
            انتظامی نظام
        </h2>

        <div class="menu-grid">

            <button class="menu-card"
                    data-page="students">

                <span class="menu-icon">
                    👧
                </span>

                <span>
                    طالبات
                </span>

                <small>
                    طالبات کا ریکارڈ
                </small>

            </button>

            <button class="menu-card"
                    data-page="teachers">

                <span class="menu-icon">
                    👩‍🏫
                </span>

                <span>
                    استادہ
                </span>

                <small>
                    استادہ کا ریکارڈ
                </small>

            </button>

            <button class="menu-card"
                    data-page="classes">

                <span class="menu-icon">
                    🏫
                </span>

                <span>
                    کلاسز
                </span>

                <small>
                    کلاس مینجمنٹ
                </small>

            </button>

            <button class="menu-card"
                    data-page="subjects">

                <span class="menu-icon">
                    📚
                </span>

                <span>
                    مضامین
                </span>

                <small>
                    مضامین کا ریکارڈ
                </small>

            </button>

            <button class="menu-card"
                    data-page="attendance">

                <span class="menu-icon">
                    📋
                </span>

                <span>
                    حاضری
                </span>

                <small>
                    حاضری کا نظام
                </small>

            </button>

            <button class="menu-card"
                    data-page="fees">

                <span class="menu-icon">
                    💰
                </span>

                <span>
                    فیس
                </span>

                <small>
                    فیس مینجمنٹ
                </small>

            </button>

            <button class="menu-card"
                    data-page="results">

                <span class="menu-icon">
                    📊
                </span>

                <span>
                    نتائج
                </span>

                <small>
                    امتحان اور نتائج
                </small>

            </button>

            <button class="menu-card"
                    data-page="reports">

                <span class="menu-icon">
                    📈
                </span>

                <span>
                    رپورٹس
                </span>

                <small>
                    تفصیلی رپورٹس
                </small>

            </button>

            <button class="menu-card"
                    data-page="users">

                <span class="menu-icon">
                    🔐
                </span>

                <span>
                    صارفین
                </span>

                <small>
                    Login Management
                </small>

            </button>

            <button class="menu-card"
                    data-page="settings">

                <span class="menu-icon">
                    ⚙️
                </span>

                <span>
                    سیٹنگز
                </span>

                <small>
                    نظام کی ترتیبات
                </small>

            </button>

        </div>

    </section>

    <button
        id="logoutButton"
        class="logout-button"
    >
        🚪 لاگ آؤٹ
    </button>

</main>

<script src="script.js"></script>

</body></html>
