<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        طالبات - مدرسہ شہناز اختر للبنات
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <div class="students-page">


        <!-- =========================
             HEADER
        ========================== -->

        <div class="students-header">

            <button
                type="button"
                id="backToDashboard"
                class="back-button"
            >
                ↩️ ڈیش بورڈ
            </button>


            <div>

                <h1>
                    طالبات
                </h1>

                <p>
                    طالبات کا مکمل ریکارڈ
                </p>

            </div>

        </div>


        <!-- =========================
             ACTIONS
        ========================== -->

        <div class="student-actions">

            <button
                type="button"
                id="showStudentForm"
                class="primary-button"
            >
                ➕ نئی طالبہ شامل کریں
            </button>

        </div>


        <!-- =========================
             SUMMARY
        ========================== -->

        <div class="students-summary">

            کل طالبات:

            <span id="studentCount">
                0
            </span>

        </div>


        <!-- =========================
             STUDENT FORM
        ========================== -->

        <div
            id="studentFormContainer"
            class="student-form-card hidden"
        >

            <h2 id="formTitle">
                نئی طالبہ کا اندراج
            </h2>


            <div
                id="studentFormMessage"
                class="form-message"
            ></div>


            <form id="studentForm">


                <!-- Hidden Student ID -->

                <input
                    type="hidden"
                    id="editStudentId"
                >


                <!-- =========================
                     ADMISSION INFORMATION
                ========================== -->

                <div class="form-section">

                    <h3>
                        📋 داخلہ کی معلومات
                    </h3>


                    <div class="form-grid">


                        <div class="form-group">

                            <label for="admissionType">
                                داخلہ کی قسم
                            </label>

                            <select
                                id="admissionType"
                                required
                            >

                                <option value="">
                                    منتخب کریں
                                </option>

                                <option value="نیا داخلہ">
                                    نیا داخلہ
                                </option>

                                <option value="منتقلی">
                                    منتقلی
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="admissionNo">
                                داخلہ نمبر
                            </label>

                            <input
                                type="text"
                                id="admissionNo"
                                required
                                placeholder="داخلہ نمبر"
                            >

                        </div>


                        <div
                            id="previousMadrassaGroup"
                            class="form-group hidden"
                        >

                            <label for="previousMadrassa">
                                سابقہ مدرسہ
                            </label>

                            <input
                                type="text"
                                id="previousMadrassa"
                                placeholder="سابقہ مدرسے کا نام"
                            >

                        </div>


                        <div
                            id="transferDateGroup"
                            class="form-group hidden"
                        >

                            <label for="transferDate">
                                منتقلی کی تاریخ
                            </label>

                            <input
                                type="date"
                                id="transferDate"
                            >

                        </div>

                    </div>

                </div>


                <!-- =========================
                     PERSONAL INFORMATION
                ========================== -->

                <div class="form-section">

                    <h3>
                        👧 طالبہ کی ذاتی معلومات
                    </h3>


                    <div class="form-grid">


                        <div class="form-group">

                            <label for="studentName">
                                طالبہ کا نام
                            </label>

                            <input
                                type="text"
                                id="studentName"
                                required
                                placeholder="طالبہ کا نام"
                            >

                        </div>


                        <div class="form-group">

                            <label for="fatherName">
                                والد کا نام
                            </label>

                            <input
                                type="text"
                                id="fatherName"
                                required
                                placeholder="والد کا نام"
                            >

                        </div>


                        <div class="form-group">

                            <label for="guardianName">
                                سرپرست کا نام
                            </label>

                            <input
                                type="text"
                                id="guardianName"
                                required
                                placeholder="سرپرست کا نام"
                            >

                        </div>


                        <div class="form-group">

                            <label for="studentCNIC">
                                شناختی کارڈ نمبر
                            </label>

                            <input
                                type="text"
                                id="studentCNIC"
                                inputmode="numeric"
                                maxlength="15"
                                required
                                placeholder="00000-0000000-0"
                            >

                        </div>


                        <div class="form-group">

                            <label for="dateOfBirth">
                                تاریخ پیدائش
                            </label>

                            <input
                                type="date"
                                id="dateOfBirth"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="studentClass">
                                کلاس
                            </label>

                            <select
                                id="studentClass"
                                required
                            >

                                <option value="">
                                    کلاس منتخب کریں
                                </option>

                                <option value="ناظرہ">
                                    ناظرہ
                                </option>

                                <option value="حفظ">
                                    حفظ
                                </option>

                                <option value="ترجمہ">
                                    ترجمہ
                                </option>

                                <option value="درس نظامی">
                                    درس نظامی
                                </option>

                                <option value="دیگر">
                                    دیگر
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                موبائل نمبر
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                inputmode="numeric"
                                maxlength="11"
                                required
                                placeholder="03XXXXXXXXX"
                            >

                        </div>


                        <div class="form-group">

                            <label for="admissionDate">
                                داخلہ کی تاریخ
                            </label>

                            <input
                                type="date"
                                id="admissionDate"
                                required
                            >

                        </div>


                        <div class="form-group full-width">

                            <label for="address">
                                مکمل پتہ
                            </label>

                            <textarea
                                id="address"
                                required
                                placeholder="مکمل پتہ درج کریں"
                            ></textarea>

                        </div>

                    </div>

                </div>


                <!-- =========================
                     RESIDENCE
                ========================== -->

                <div class="form-section">

                    <h3>
                        🏠 رہائش کی معلومات
                    </h3>


                    <div class="form-grid">

                        <div class="form-group">

                            <label for="residenceType">
                                رہائش کی قسم
                            </label>

                            <select
                                id="residenceType"
                                required
                            >

                                <option value="">
                                    منتخب کریں
                                </option>

                                <option value="گھر">
                                    گھر
                                </option>

                                <option value="ہاسٹل">
                                    ہاسٹل
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- =========================
                         MAHRAM
                    ========================== -->

                    <div
                        id="mahramSection"
                        class="hidden"
                    >

                        <div class="mahram-warning">

                            ⚠️ ہاسٹل میں داخلے کے لیے کم از کم ایک
                            محرم کی مکمل معلومات اور منظوری ضروری ہے۔

                        </div>


                        <div id="mahramList"></div>


                        <button
                            type="button"
                            id="addMahram"
                            class="add-mahram-button"
                        >
                            ➕ محرم شامل کریں
                        </button>

                    </div>

                </div>


                <!-- =========================
                     FORM BUTTONS
                ========================== -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        id="saveStudentButton"
                        class="save-button"
                    >
                        💾 محفوظ کریں
                    </button>


                    <button
                        type="button"
                        id="cancelStudentForm"
                        class="cancel-button"
                    >
                        ❌ منسوخ کریں
                    </button>

                </div>


            </form>

        </div>


        <!-- =========================
             STUDENT LIST
        ========================== -->

        <div class="student-list-section">

            <div class="student-list-header">

                <h2>
                    📚 طالبات کا ریکارڈ
                </h2>


                <input
                    type="search"
                    id="studentSearch"
                    placeholder="🔍 طالبہ تلاش کریں"
                >

            </div>


            <div id="studentsList"></div>

        </div>


    </div>


    <!-- =================================================
         STUDENT DETAILS MODAL
    ================================================== -->

    <div
        id="studentDetailsOverlay"
        class="student-details-overlay hidden"
        style="
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        "
    >

        <div
            id="studentDetailsBox"
            class="student-details-box"
            style="
                width: 100%;
                max-width: 650px;
                max-height: 90vh;
                overflow-y: auto;
                background: white;
                border-radius: 20px;
                padding: 20px;
                position: relative;
            "
        >


            <!-- Details Header -->

            <div
                class="student-details-header"
                style="
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 15px;
                    margin-bottom: 20px;
                "
            >

                <h2
                    id="studentDetailsTitle"
                    style="margin: 0;"
                >
                    طالبہ کی تفصیلات
                </h2>


                <button
                    type="button"
                    id="closeStudentDetails"
                    class="close-details-button"
                    style="
                        width: auto;
                        min-width: 55px;
                        margin: 0;
                    "
                >
                    ✖
                </button>

            </div>


            <!-- Details Content -->

            <div id="studentDetailsContent"></div>


        </div>

    </div>


    <!-- =================================================
         SUPABASE
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =================================================
         MAIN SCRIPT
    ================================================== -->

    <script src="script.js?v=10"></script>


</body>

</html>
