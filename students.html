<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>طالبات - مدرسہ شہناز اختر للبنات</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="students-page">


        <!-- Header -->

        <div class="students-header">

            <button
                type="button"
                id="backToDashboard"
                class="back-button"
            >
                ↩️ ڈیش بورڈ
            </button>

            <div>

                <h1>
                    طالبات
                </h1>

                <p>
                    طالبات کا مکمل ریکارڈ
                </p>

            </div>

        </div>


        <!-- Actions -->

        <div class="student-actions">

            <button
                type="button"
                id="showStudentForm"
                class="primary-button"
            >
                ➕ نئی طالبہ شامل کریں
            </button>

        </div>


        <!-- Summary -->

        <div class="students-summary">

            کل طالبات:

            <span id="studentCount">
                0
            </span>

        </div>


        <!-- Student Form -->

        <div
            id="studentFormContainer"
            class="student-form-card hidden"
        >

            <h2 id="formTitle">
                نئی طالبہ کا اندراج
            </h2>


            <form id="studentForm">


                <!-- Hidden ID -->

                <input
                    type="hidden"
                    id="editStudentId"
                >


                <!-- Admission Information -->

                <div class="form-section">

                    <h3>
                        📋 داخلہ کی معلومات
                    </h3>

                    <div class="form-grid">


                        <div class="form-group">

                            <label for="admissionType">
                                داخلہ کی قسم
                            </label>

                            <select id="admissionType" required>

                                <option value="">
                                    منتخب کریں
                                </option>

                                <option value="نیا داخلہ">
                                    نیا داخلہ
                                </option>

                                <option value="منتقلی">
                                    منتقلی
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="admissionNo">
                                داخلہ نمبر
                            </label>

                            <input
                                type="text"
                                id="admissionNo"
                                required
                                placeholder="داخلہ نمبر"
                            >

                        </div>


                        <div
                            id="previousMadrassaGroup"
                            class="form-group hidden"
                        >

                            <label for="previousMadrassa">
                                سابقہ مدرسہ
                            </label>

                            <input
                                type="text"
                                id="previousMadrassa"
                                placeholder="سابقہ مدرسے کا نام"
                            >

                        </div>


                        <div
                            id="transferDateGroup"
                            class="form-group hidden"
                        >

                            <label for="transferDate">
                                منتقلی کی تاریخ
                            </label>

                            <input
                                type="date"
                                id="transferDate"
                            >

                        </div>

                    </div>

                </div>


                <!-- Personal Information -->

                <div class="form-section">

                    <h3>
                        👧 طالبہ کی ذاتی معلومات
                    </h3>

                    <div class="form-grid">


                        <div class="form-group">

                            <label for="studentName">
                                طالبہ کا نام
                            </label>

                            <input
                                type="text"
                                id="studentName"
                                required
                                placeholder="طالبہ کا نام"
                            >

                        </div>


                        <div class="form-group">

                            <label for="fatherName">
                                والد کا نام
                            </label>

                            <input
                                type="text"
                                id="fatherName"
                                required
                                placeholder="والد کا نام"
                            >

                        </div>


                        <div class="form-group">

                            <label for="guardianName">
                                سرپرست کا نام
                            </label>

                            <input
                                type="text"
                                id="guardianName"
                                required
                                placeholder="سرپرست کا نام"
                            >

                        </div>


                        <div class="form-group">

                            <label for="studentCNIC">
                                شناختی کارڈ نمبر
                            </label>

                            <input
                                type="text"
                                id="studentCNIC"
                                inputmode="numeric"
                                maxlength="15"
                                required
                                placeholder="00000-0000000-0"
                            >

                        </div>


                        <div class="form-group">

                            <label for="dateOfBirth">
                                تاریخ پیدائش
                            </label>

                            <input
                                type="date"
                                id="dateOfBirth"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="studentClass">
                                کلاس
                            </label>

                            <select
                                id="studentClass"
                                required
                            >

                                <option value="">
                                    کلاس منتخب کریں
                                </option>

                                <option value="ناظرہ">
                                    ناظرہ
                                </option>

                                <option value="حفظ">
                                    حفظ
                                </option>

                                <option value="ترجمہ">
                                    ترجمہ
                                </option>

                                <option value="درس نظامی">
                                    درس نظامی
                                </option>

                                <option value="دیگر">
                                    دیگر
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                موبائل نمبر
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                inputmode="numeric"
                                maxlength="11"
                                required
                                placeholder="03XXXXXXXXX"
                            >

                        </div>


                        <div class="form-group">

                            <label for="admissionDate">
                                داخلہ کی تاریخ
                            </label>

                            <input
                                type="date"
                                id="admissionDate"
                                required
                            >

                        </div>


                        <div class="form-group full-width">

                            <label for="address">
                                مکمل پتہ
                            </label>

                            <textarea
                                id="address"
                                required
                                placeholder="مکمل پتہ درج کریں"
                            ></textarea>

                        </div>

                    </div>

                </div>


                <!-- Residence -->

                <div class="form-section">

                    <h3>
                        🏠 رہائش کی معلومات
                    </h3>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="residenceType">
                                رہائش کی قسم
                            </label>

                            <select
                                id="residenceType"
                                required
                            >

                                <option value="">
                                    منتخب کریں
                                </option>

                                <option value="گھر">
                                    گھر
                                </option>

                                <option value="ہاسٹل">
                                    ہاسٹل
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- Mahram -->

                    <div
                        id="mahramSection"
                        class="hidden"
                    >

                        <div class="mahram-warning">

                            ⚠️ ہاسٹل میں داخلے کے لیے کم از کم ایک
                            محرم کی مکمل معلومات اور منظوری ضروری ہے۔

                        </div>


                        <div id="mahramList"></div>


                        <button
                            type="button"
                            id="addMahram"
                            class="add-mahram-button"
                        >
                            ➕ محرم شامل کریں
                        </button>

                    </div>

                </div>


                <!-- Form Buttons -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="save-button"
                    >
                        💾 محفوظ کریں
                    </button>

                    <button
                        type="button"
                        id="cancelStudentForm"
                        class="cancel-button"
                    >
                        ❌ منسوخ کریں
                    </button>

                </div>

            </form>

        </div>


        <!-- Student List -->

        <div class="student-list-section">

            <div class="student-list-header">

                <h2>
                    📚 طالبات کا ریکارڈ
                </h2>

                <input
                    type="search"
                    id="studentSearch"
                    placeholder="🔍 طالبہ تلاش کریں"
                >

            </div>


            <div id="studentsList"></div>

        </div>

    </div>


    <!-- Supabase MUST load before script.js -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- script.js loaded ONLY ONCE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>

</html>
