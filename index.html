<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        مدرسہ شہناز اختر للبنات
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="container">

        <div
            class="logo"
            aria-hidden="true"
        >
            🕌
        </div>

        <h1>
            مدرسہ شہناز اختر للبنات
        </h1>

        <p class="address">
            گاؤں غرشٹو، ضلع بونیر
        </p>

        <div class="system-title">
            مدرسہ مینجمنٹ سسٹم
        </div>

        <p class="subtitle">
            براہِ کرم اپنا اکاؤنٹ منتخب کریں
        </p>


        <button
            type="button"
            id="adminLoginButton"
        >
            👑 ایڈمن لاگ اِن
        </button>

        <button
            type="button"
            id="teacherLoginButton"
        >
            👩‍🏫 استاد لاگ اِن
        </button>

        <button
            type="button"
            id="studentLoginButton"
        >
            👧 طالبہ لاگ اِن
        </button>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="script.js"></script>

</body>

</html>
